name: Debug - feeds (temporary)
on:
  push:
    branches:
      - claude/legal-research-website-jyihm4
    paths:
      - ".github/workflows/debug-models.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe candidate feeds
        run: |
          cat > /tmp/probe.mjs <<'JS'
          import { parseFeed } from "./lib/research/feeds.mjs";
          const urls = process.argv.slice(2);
          const UA = "Mozilla/5.0 (compatible; law-monitor-agent/1.0; feed reader)";
          for (const url of urls) {
            try {
              const res = await fetch(url, { headers: { "User-Agent": UA, Accept: "application/rss+xml, application/atom+xml, application/xml, text/xml, */*" }, signal: AbortSignal.timeout(25000), redirect: "follow" });
              const text = await res.text();
              const items = parseFeed(text);
              const dates = items.map((i) => i.published).filter(Boolean).sort((a, b) => b - a);
              console.log(`${String(res.status).padEnd(4)} items=${String(items.length).padEnd(4)} newest=${dates[0] ? dates[0].toISOString().slice(0, 10) : "-"} oldest=${dates.length ? dates[dates.length - 1].toISOString().slice(0, 10) : "-"} type=${(res.headers.get("content-type") || "").slice(0, 30).padEnd(30)} len=${String(text.length).padEnd(7)} ${url}${res.redirected ? " -> " + res.url : ""}`);
              if (items[0]) console.log(`       first: ${items[0].title.slice(0, 90)}`);
              else console.log(`       body: ${text.slice(0, 110).replace(/\s+/g, " ")}`);
            } catch (e) { console.log(`ERR  ${url} ${e?.cause?.code || e?.name || e}`); }
          }
          JS
          cp /tmp/probe.mjs ./probe-tmp.mjs
          node probe-tmp.mjs \
            https://www.edpb.europa.eu/feed/news_en \
            https://www.edpb.europa.eu/rss_en \
            https://edpb.europa.eu/feed/news_en \
            https://www.edps.europa.eu/feed/news_en \
            https://www.europarl.europa.eu/rss/doc/press-releases/en.xml \
            https://www.europarl.europa.eu/rss/doc/top-stories/en.xml \
            https://www.dataprotectionreport.com/feed/ \
            https://privacymatters.dlapiper.com/feed/ \
            https://www.chinalawtranslate.com/feed/ \
            https://www.chinalawtranslate.com/en/feed/ \
            https://www.pcpd.org.hk/english/rss/rss.xml \
            https://www.pcpd.org.hk/rss/rss_e.xml \
            https://www.pdpc.gov.sg/rss \
            https://www.ppc.go.jp/rss/news.xml \
            https://www.ppc.go.jp/en/rss.xml \
            https://iapp.org/rss/daily-dashboard/ \
            https://www.globalpolicywatch.com/feed/ \
            https://www.privacyworld.blog/feed/ \
            https://www.debevoisedatablog.com/feed/ \
            https://law.asia/feed/ \
            https://www.techpolicy.press/rss/feed.xml \
            https://www.insidetechlaw.com/feed/ \
            https://www.technologylawdispatch.com/feed/ \
            https://www.huntonak.com/privacy-and-information-security-law/feed \
            https://www.lexology.com/rss \
