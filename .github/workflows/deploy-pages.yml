name: Deploy to GitHub Pages

# Builds the static site and publishes it to GitHub Pages on every push to the
# feature branch. In the repo: Settings → Pages → Source → "GitHub Actions".
on:
  push:
    branches:
      - claude/privacy-ai-law-monitor-lybwto
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Content integrity gate: a mapping that misquotes the statute must never
      # reach the published site. Offline and deterministic, so it is safe to block on.
      - name: Check quote anchoring
        run: node scripts/check-quotes.mjs
      # An untagged remediation step renders with the weakest label, which
      # understates a mandatory duty without any visible symptom.
      - name: Check remediation basis tags
        run: node scripts/check-remediation.mjs
      - name: Build static export
        env:
          # Must match the canonical Pages URL casing exactly:
          # https://learner-agent-sudo.github.io/Monitor-law/
          NEXT_PUBLIC_BASE_PATH: /Monitor-law
        run: npm run build
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
